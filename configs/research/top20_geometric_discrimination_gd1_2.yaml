stage: GD1.2
name: contiguous_oof_multivariate_geometry_selector_diagnostic
output_root: outputs/research_runs/top20_geometric_discrimination_v1/gd1_2

gd1_0:
  report: outputs/research_runs/top20_geometric_discrimination_v1/gd1_0/gd1_0_freeze_report.json

gd1_1:
  report: outputs/research_runs/top20_geometric_discrimination_v1/gd1_1/gd1_1_discrimination_report.json
  labeled_evidence: outputs/research_runs/top20_geometric_discrimination_v1/gd1_1/gd1_1_labeled_top20_geometric_evidence.csv
  expected_feature_discrimination_sha256: 8ae2e25da535b448b4f0f3782c8afb5ecfc42afb4aa243d26896d52cffc0d409
  expected_queries: 403
  expected_pairs: 8060

labels:
  - contains_query
  - center_le40
  - center_le80

evaluation:
  folds: 5
  fold_scheme: contiguous_query_blocks
  topk:
    - 1
    - 3
    - 5
    - 10
    - 20
  logistic_l2: 1.0
  logistic_max_iterations: 100
  logistic_tolerance: 1.0e-7
  balanced_class_weights: true
  preprocessing:
    imputation: training_median
    scaling: training_median_iqr_then_std_fallback
    standardized_clip: 8.0
  tie_break: frozen_pool_rank_then_tile_id
  no_hyperparameter_tuning: true

model_families:
  - retrieval_rank_only
  - inliers_only
  - correspondence_strength
  - spatial_support
  - residual_geometry
  - local_feature_consistency
  - homography_shape
  - projective_stability
  - all_geometry
  - all_geometry_plus_retrieval_rank

scientific_boundary:
  development_only: true
  blind_stress_loaded: false
  blind_stress_reference_used: false
  hyperparameter_tuning_enabled: false
  frontend_changed: false
  candidate_pool_changed: false
  deployable_model_exported: false
  bootstrap_enabled: false
  state_enabled: false
