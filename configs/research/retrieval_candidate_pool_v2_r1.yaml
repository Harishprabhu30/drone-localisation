stage: R1
name: retrieval_candidate_pool_v2_ground_footprint_pyramid

control:
  baseline_commit: 256595bed684c3bb6fbfccf7e0faaaeaec3d02f5
  a1_closeout_commit: d6ac10e308a0c1cdb2ac305147e741fed632dbae
  query_cache: outputs/villoc/traj01_90deg_stable120m/descriptors/s8_11c_dinov2_queries_v_1fps_dinov2_vits14_img518_center_square_avgpatch_cpu.npz
  query_count_expected: 403
  map_source: ort10lt_2024_2026
  source_tif: data/processed/villoc/90_deg/maps/ort10lt_2024_2026/ort10lt_2024_2026_aoi300m.tif
  crs_expected: EPSG:3346
  source_gsd_m_per_px_expected: 0.20

retrieval_protocol:
  backend: dinov2_cached_cosine_v1
  model_name: dinov2_vits14
  image_size: 518
  crop_mode: center_square
  pooling: avgpatch
  normalization: imagenet
  l2_normalize: true
  descriptor_dtype: float32
  ranking: numpy_argsort_descending
  top_k_primary: 20

experiment:
  independent_variable: map_ground_footprint
  fixed_stride_px: 256
  fixed_stride_expected_m: 51.2
  rationale: >
    Hold source-raster center spacing fixed while changing source window size,
    so candidate density is not intentionally changed together with physical
    footprint.
  levels:
    - name: 384_s256
      tile_size_px: 384
      stride_px: 256
      expected_ground_footprint_m: 76.8
      status: generate
      tiles_dir: data/processed/villoc/research/retrieval_candidate_pool_v2/r1/tiles_384_s256
      index_csv: outputs/research_runs/retrieval_candidate_pool_v2/r1_map_pyramid/metadata/s8_9_satellite_tile_index_384_s256.csv
      map_cache: outputs/research_runs/retrieval_candidate_pool_v2/r1_map_pyramid/descriptors/s8_11b_dinov2_map_384_s256_dinov2_vits14_img518_center_square_avgpatch_cpu.npz
    - name: 512_s256
      tile_size_px: 512
      stride_px: 256
      expected_ground_footprint_m: 102.4
      status: frozen_control_reuse
      tiles_dir: data/processed/villoc/90_deg/maps/ort10lt_2024_2026/tiles_512_s256
      index_csv: outputs/villoc/90_deg/metadata/s8_9_satellite_tile_index_512_s256.csv
      map_cache: outputs/villoc/90_deg/descriptors/s8_11b_dinov2_map_512_s256_dinov2_vits14_img518_center_square_avgpatch_cpu.npz
    - name: 768_s256
      tile_size_px: 768
      stride_px: 256
      expected_ground_footprint_m: 153.6
      status: generate
      tiles_dir: data/processed/villoc/research/retrieval_candidate_pool_v2/r1/tiles_768_s256
      index_csv: outputs/research_runs/retrieval_candidate_pool_v2/r1_map_pyramid/metadata/s8_9_satellite_tile_index_768_s256.csv
      map_cache: outputs/research_runs/retrieval_candidate_pool_v2/r1_map_pyramid/descriptors/s8_11b_dinov2_map_768_s256_dinov2_vits14_img518_center_square_avgpatch_cpu.npz
    - name: 1024_s256
      tile_size_px: 1024
      stride_px: 256
      expected_ground_footprint_m: 204.8
      status: existing_endpoint_reuse
      tiles_dir: data/processed/villoc/90_deg/maps/ort10lt_2024_2026/tiles_1024_s256
      index_csv: outputs/villoc/90_deg/metadata/s8_9_satellite_tile_index_1024_s256.csv
      map_cache: outputs/villoc/90_deg/descriptors/s8_11b_dinov2_map_1024_s256_dinov2_vits14_img518_center_square_avgpatch_cpu.npz

evaluation:
  ranking_uses_coordinates: false
  ranking_uses_oracle: false
  required_metrics:
    - recall_at_1
    - recall_at_5
    - recall_at_20
    - first_useful_candidate_rank
    - useful_candidate_in_top20
    - center_error_le_40m
    - center_error_le_80m
    - geometric_containment_or_overlap
    - distinct_spatial_regions_in_top20
    - candidate_spatial_dispersion
  named_diagnostics:
    - q57
    - q228

non_goals:
  - query_crop_changes
  - descriptor_spatial_pyramid
  - DINOv3
  - SALAD
  - ORB_policy_changes
  - bootstrap_changes
  - temporal_authority_changes
  - dependency_modernization
