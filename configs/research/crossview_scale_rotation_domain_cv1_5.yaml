camera_audit:
  nominal_blind_altitude_m: 120.0
  nominal_blind_pitch_deg: -90.0
  original_resolution_px:
    width: 3840
    height: 2160
  baseline_processed_long_edge_px: 1024
  focal_length_semantics_verified: false
  calibrated_intrinsics_available: false
  camera_model_identified_in_repo: false
  metadata_geometry_fields:
    - focal_len_mm
    - dzoom_ratio
    - rel_alt_m
    - gb_pitch_deg
    - gb_roll_deg
  metadata_explanatory_only:
    - gb_yaw_deg
    - abs_alt_m
    - fnum
    - iso
    - shutter
    - ev
  forbidden_camera_output_fields:
    - lat
    - lon
    - latitude
    - longitude

mechanism:
  paired_metrics:
    - good_matches
    - inliers
    - inlier_ratio
    - query_bbox_coverage
    - tile_bbox_coverage
    - query_hull_coverage
    - tile_hull_coverage
    - orientation_resultant
    - orientation_mad_deg
    - log_scale_ratio_median
    - log_scale_ratio_mad
    - symmetric_error_median_px
    - jacobian_anisotropy
  keypoint_octaves:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7

scientific_boundary:
