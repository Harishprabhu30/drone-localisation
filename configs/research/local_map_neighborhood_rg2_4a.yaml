manifests:
  development: outputs/research_runs/trajectory_adapter_v1/ta2_traj01/blind_package/canonical_blind_manifest.csv
  blind_stress: outputs/research_runs/trajectory_adapter_v1/ta3_blind_demo/blind_package/canonical_blind_manifest.csv

locality_contract:
  projection_view: all_finite
  subsets:
    - immediate
    - full_overlap
  methods:
    - coordinate_median
    - geometric_median
    - medoid
    - radius_cluster_medoid
    - inlier_huber_centroid
  link_thresholds_m:
    quarter_stride: 12.8
    half_stride: 25.6
  threshold_provenance: R4.18 quarter/half of frozen 51.2m map stride
  contiguous_gap_multiplier: 1.5
  contiguous_gap_provenance: RG1.5
  locality_rule: consecutive_consensus_points_link_if_contiguous_time_and_jump_within_threshold
  method_selection_enabled: false

run_metrics:
  - query_count
  - duration_s
  - consensus_path_length_m
  - consensus_max_pairwise_span_m
  - start_end_displacement_m
  - unique_anchor_tiles
  - anchor_tile_changes
  - distinct_supporting_tile_windows
  - supporting_window_observations
  - support_redundancy_ratio
  - radial_median_median_m
  - pairwise_p90_median_m
  - bbox_diagonal_median_m

scientific_boundary:
  reference_allowed: false
  reference_attachment_enabled: false
  srt_gps_allowed: false
  oracle_labels_allowed: false
  rg2_3b_accuracy_inputs_allowed: false
  method_selection_enabled: false
  threshold_tuning_enabled: false
  consensus_rerun_enabled: false
  orb_rerun_enabled: false
  projection_rerun_enabled: false
  bootstrap_enabled: false
  state_enabled: false
  relative_frontend_fusion_enabled: false
