  - method_id: orb_query_relative_both_localities
    display_name: ORB query-relative + both localities
    family: locality_plus_geometry
    frontend: ORB
    retrieval: QV1.4 Top20
    selector: OOF query-relative + nearby + overlap
    source: gd1_3b
