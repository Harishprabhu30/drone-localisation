    selector: OOF query-relative geometry
    source: gd1_3b
    method_key: all_query_relative_geometry

  - method_id: orb_nearby_locality
    display_name: ORB nearby locality only
    family: locality
    frontend: ORB
    retrieval: QV1.4 Top20
    selector: OOF nearby-component evidence
    source: gd1_3b
    method_key: nearby_locality_only

  - method_id: orb_overlap_locality
    display_name: ORB overlap locality only
    family: locality
    frontend: ORB
