  - method_id: orb_raw_frontend
    display_name: ORB raw frontend
    family: frontend_diagnostic
    frontend: ORB
    retrieval: QV1.4 Top20
    selector: none
    source: gd1_0
    targets: []
    notes: Reference-free frontend coverage only.

  - method_id: xfeat_raw_frontend
    display_name: XFeat raw frontend
    family: frontend_diagnostic
    frontend: XFeat sparse
    retrieval: QV1.4 Top20
    selector: none
    source: lf1_1a
    targets: []
    notes: Reference-free frontend coverage only; accuracy comparison follows LF1.1-B.
