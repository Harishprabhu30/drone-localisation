report:
  id: global_development_story_assets
  title: Development path assets for final internship report
  purpose: >
    Validate and organize non-Villoc-traj01 assets used to explain how the final
    pipeline was developed: Zurich MAV infrastructure, SatLoc absolute localization,
    SatLoc fusion logic, Villoc pilot diagnostics, and final architecture diagrams.

project:
  repo_root: .
  reporting_root: outputs/villoc/traj01_90deg_stable120m/reporting
  final_asset_dir: docs/assets/final_report_global_story

story_roles:
  zurich:
    role: infrastructure_and_geometry_learning
    main_report_usage: compact
    include_in_appendix: true
    message: >
      Zurich MAV was used to build dataset loading, synchronization, reference trajectory
      visualization, Folium maps, ORB tracking diagnostics, and geometry/sensor failure analysis.
      It is not the final accuracy dataset.

  satloc:
    role: absolute_localization_algorithm_lab
    main_report_usage: compact
    include_in_appendix: true
    message: >
      SatLoc was used to develop map tile indexing, UAV-to-map retrieval, LightGlue
      verification, temporal absolute coverage, and relative-absolute fusion logic.

  villoc_pilot:
    role: real_vilnius_map_localization_pilot
    main_report_usage: compact
    include_in_appendix: true
    message: >
      Villoc 90°/45° pilot runs validated the real orthophoto AOI, DINO retrieval diagnostics,
      tile variants, oblique/nadir behavior, and ranking/refinement failure modes.

  villoc_traj01:
    role: final_company_facing_demonstrator
    main_report_usage: primary
    include_in_appendix: true
    message: >
      Villoc traj01 stable-120m is the final recorded-data demonstrator and should carry
      the main result figures.

